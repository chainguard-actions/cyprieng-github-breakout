name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release"
        default: "0.0.1"
        required: true
        type: string
      description:
        description: "Release description"
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: npm ci

      - run: npm run build

      - name: bump package version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: npm version --no-git-tag-version --new-version "$VERSION"

      - name: push new build, tag version and push
        id: push-tags
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config --global user.email "bot@cyprien.io"
          git config --global user.name "release bot"
          git add package.json dist 
          git commit -m "$VERSION"
          git tag v"$VERSION"
          git push origin main --tags

          git tag "v$( echo "$VERSION" | cut -d. -f 1-1 )"
          git push origin --tags --force

      - uses: ncipollo/release-action@1c89adf39833729d8f85a31ccbc451b078733c80 # v1.19.1
        with:
          tag: v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.description }}
