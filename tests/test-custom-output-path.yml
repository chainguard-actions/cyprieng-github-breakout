name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/custom-output"
      - id: action
        uses: .
        with:
          github_username: octocat
          output_path: custom-output
      - name: Assert SVG output files were created in custom path
        run: |
          echo "Listing custom-output directory..."
          ls -la "$GITHUB_WORKSPACE/custom-output" || true
          SVG_COUNT=$(find "$GITHUB_WORKSPACE/custom-output" -name "*.svg" | wc -l)
          echo "SVG files found in custom-output: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one SVG file in custom-output directory"
            exit 1
          fi
          echo "PASS: SVG file(s) generated in custom output path"
