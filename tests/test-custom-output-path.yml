name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p /tmp/breakout-output
      - id: action
        uses: .
        with:
          github_username: octocat
          output_path: /tmp/breakout-output
      - name: Assert SVG files were generated in custom output path
        run: |
          echo "Checking for generated SVG files in /tmp/breakout-output..."
          SVG_COUNT=$(find /tmp/breakout-output -name "*.svg" | wc -l)
          echo "SVG files found: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one SVG file in /tmp/breakout-output"
            exit 1
          fi
          echo "PASS: SVG files were generated in the custom output path"
          ls -la /tmp/breakout-output/
