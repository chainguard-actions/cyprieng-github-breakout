name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_username: octocat
      - name: Assert SVG files were generated
        run: |
          echo "Checking for generated SVG files..."
          # The action should generate SVG files in the default output location
          # Look for any SVG files created by the action
          SVG_COUNT=$(find . -name "*.svg" -not -path "./.git/*" | wc -l)
          echo "SVG files found: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one SVG file to be generated"
            exit 1
          fi
          echo "PASS: SVG files were generated"
