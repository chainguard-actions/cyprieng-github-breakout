name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_username: octocat
      - name: Assert SVG files were generated
        run: |
          echo "Listing workspace for generated SVGs..."
          ls -la "$GITHUB_WORKSPACE" || true
          # The action should generate at least one SVG file in the workspace
          SVG_COUNT=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.svg" | wc -l)
          echo "SVG count: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one SVG file to be generated"
            exit 1
          fi
          echo "PASS: $SVG_COUNT SVG file(s) generated"
