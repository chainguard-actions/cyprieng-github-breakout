name: Test custom colors and ghost bricks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_username: octocat
          output_path: colored-output
          paddle_color: "#FF0000"
          ball_color: "#00FF00"
          bricks_colors: "#0000FF,#FF00FF"
          enable_ghost_bricks: "true"
      - name: Assert SVG files were generated with custom colors
        run: |
          echo "Checking for generated SVG files in colored-output directory..."
          if [ ! -d "colored-output" ]; then
            echo "FAIL: colored-output directory was not created"
            exit 1
          fi
          SVG_COUNT=$(find colored-output -name "*.svg" | wc -l)
          echo "SVG files found in colored-output: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: No SVG files were generated in colored-output directory"
            exit 1
          fi
          echo "PASS: SVG files were generated with custom colors"
