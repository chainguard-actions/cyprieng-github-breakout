name: Test custom colors and ghost bricks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/colored-output"
      - id: action
        uses: .
        with:
          github_username: octocat
          output_path: colored-output
          paddle_color: "#FF0000"
          ball_color: "#00FF00"
          bricks_colors: "#0000FF,#FF00FF"
          enable_ghost_bricks: "true"
      - name: Assert SVG output files were created with custom colors
        run: |
          echo "Listing colored-output directory..."
          ls -la "$GITHUB_WORKSPACE/colored-output" || true
          SVG_COUNT=$(find "$GITHUB_WORKSPACE/colored-output" -name "*.svg" | wc -l)
          echo "SVG files found in colored-output: $SVG_COUNT"
          if [ "$SVG_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one SVG file in colored-output directory"
            exit 1
          fi
          echo "PASS: SVG file(s) generated with custom colors and ghost bricks"
